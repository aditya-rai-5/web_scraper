name: Run IITI Scraper Manually

on:
  workflow_dispatch:  # Only run manually from GitHub Actions tab

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ghostscript python3-tk
        pip install "camelot-py[cv]" beautifulsoup4 requests PyPDF2 pandas tqdm pathway

    - name: Run the scraper
      run: python scraper.py

    - name: Run the cleaner
      run: python data_cleaner.py
